<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo V4 - Escolha de Cartela</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{background:#070b18}.glass{background:rgba(255,255,255,.07); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.12)}.cartela-mini{cursor:pointer; transition:.2s}.cartela-mini:hover{transform:scale(1.02); border-color:#3b82f6}.cartela-mini.sel{border:2px solid #3b82f6; background:rgba(59,130,246,.2)}</style>
</head>
<body class="text-white p-3">

<!-- ADMIN -->
<div id="adminRoot" class="max-w-6xl mx-auto">
  <div id="setupSala" class="glass rounded-[2rem] p-8 max-w-xl mx-auto mt-16 text-center">
    <h1 class="text-4xl font-black">BINGO <span class="text-blue-400">V4</span></h1>
    <input id="nomeSala" placeholder="Nome da festa" class="w-full bg-black/50 p-4 rounded-xl mb-3 mt-6">
    <input id="totalCartelas" type="number" value="50" class="w-full bg-black/50 p-4 rounded-xl mb-6">
    <button onclick="criarSala()" class="w-full bg-blue-600 py-4 rounded-xl font-black">GERAR SALA E DISPONIBILIZAR CARTELAS</button>
  </div>

  <div id="painelAdmin" class="hidden">
    <div class="glass rounded-2xl p-5 flex justify-between gap-6 mb-4">
      <div><h2 id="tituloSala" class="text-2xl font-black"></h2><p id="estoqueInfo" class="opacity-60 text-sm"></p><input id="linkConvite" readonly class="w-full mt-2 bg-black/50 p-2 rounded text-xs"><div class="flex gap-2 mt-2"><button onclick="copiarLink()" class="bg-white text-black px-4 py-2 rounded-xl font-bold text-sm">Copiar Link</button><span class="glass px-3 py-2 rounded-xl text-sm">Código: <b id="codigoSala"></b></span></div></div>
      <div class="bg-white p-2 rounded-xl"><div id="qrcode"></div></div>
    </div>

    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-5 glass rounded-2xl p-4">
        <h3 class="font-bold text-sm">🏆 Prêmios</h3><div id="listaPremios" class="mt-2"></div>
        <div class="flex gap-2 mt-2"><select id="tipoPremio" class="bg-black/50 rounded p-2 flex-1 text-sm"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="diagonal">Diagonal</option><option value="4cantos">4 Cantos</option></select><button onclick="addPremio()" class="bg-blue-600 px-3 rounded">+ Add</button></div>
        <h3 class="font-bold mt-6">🎱 Sorteio</h3><div id="ultimoNumero" class="text-5xl font-black text-center py-3 text-blue-400">--</div><button onclick="sortear()" class="w-full bg-white text-black py-2 rounded-xl font-black">SORTEAR</button><div id="numerosSorteados" class="flex flex-wrap gap-1 mt-2"></div>
        <button id="btnIniciar" onclick="iniciarPartida()" class="w-full mt-4 bg-green-600 py-3 rounded-xl font-black">🚀 INICIAR</button>
      </div>
      <div class="col-span-7 glass rounded-2xl p-4">
        <h3 class="font-bold">👥 Jogadores na Sala</h3>
        <p class="text-xs opacity-60">🔴 Vermelho = entrou na sala, não escolheu cartela | 🟢 Verde = escolheu e clicou PRONTO</p>
        <div id="listaJogadoresAdmin" class="mt-3 space-y-2"></div>
        <div id="painelExtra" class="mt-4 border-t border-white/10 pt-3 flex gap-2">
          <select id="selectJogadorExtra" class="bg-black/50 rounded p-2 flex-1 text-sm"></select><input id="qtdExtra" type="number" value="1" class="bg-black/50 w-16 rounded p-2"><button onclick="liberarExtra()" class="bg-blue-600 px-3 rounded text-sm">Liberar Extra</button>
        </div>
        <div class="mt-4 bg-yellow-500/10 p-3 rounded-xl"><h4 class="font-bold text-yellow-300 text-sm">⚠️ BINGOS PARA VALIDAR</h4><div id="alertasBingo" class="text-xs mt-1"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- PLAYER - TELA BEM DIFERENTE -->
<div id="playerRoot" class="hidden max-w-6xl mx-auto">
  <!-- ETAPA 1: NOME E MARCADOR -->
  <div id="playerLogin" class="glass rounded-[2rem] p-8 max-w-xl mx-auto mt-10">
    <h1 class="text-3xl font-black text-center">ENTRAR NA SALA</h1><p id="playerSalaNome" class="text-center opacity-60 mb-6"></p>
    <input id="nomeJogador" placeholder="Seu nome" class="w-full bg-black/50 p-4 rounded-xl mb-3">
    <div class="grid grid-cols-5 gap-2 mb-4"><button onclick="setMarcador('🔴')" class="glass p-3 rounded-xl">🔴</button><button onclick="setMarcador('🔵')" class="glass p-3 rounded-xl">🔵</button><button onclick="setMarcador('🟢')" class="glass p-3 rounded-xl">🟢</button><button onclick="setMarcador('❌')" class="glass p-3 rounded-xl">❌</button><button onclick="setMarcador('❤️')" class="glass p-3 rounded-xl">❤️</button></div>
    <div class="text-center mb-6">Marcador: <span id="marcadorAtual" class="text-2xl">🔴</span></div>
    <button onclick="entrarNaSala()" class="w-full bg-blue-600 py-4 rounded-xl font-black">ENTRAR NA SALA</button>
  </div>

  <!-- ETAPA 2: ESCOLHER CARTELA -->
  <div id="playerEscolha" class="hidden">
    <div class="glass rounded-2xl p-4 mb-4 flex justify-between items-center"><h2 class="font-black">Escolha sua cartela - <span id="playerNomeDisplay2"></span></h2><span id="playerEstoque" class="text-sm opacity-60"></span></div>
    <div id="gridCartelasDisponiveis" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
    <div class="fixed bottom-0 left-0 right-0 glass p-4 flex justify-center gap-4"><span id="cartelaEscolhidaInfo" class="opacity-60 text-sm py-3">Nenhuma cartela selecionada</span><button id="btnPronto" onclick="clicarPronto()" disabled class="bg-gray-600 px-10 py-3 rounded-xl font-black opacity-50">PRONTO</button></div>
  </div>

  <!-- ETAPA 3: JOGO -->
  <div id="playerCartelas" class="hidden">
    <div class="glass rounded-2xl p-4 flex justify-between mb-4"><span id="playerNomeDisplay" class="font-bold"></span><span>Último: <b id="playerUltimoSorteado" class="text-blue-400 text-xl">--</b></span></div>
    <div id="gridCartelas" class="grid gap-6 max-w-3xl mx-auto"></div>
    <div id="bloqueioExtra" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-6"><div class="glass rounded-[2rem] p-8 text-center max-w-sm w-full"><h2 class="text-2xl font-black">🎉 NOVA CARTELA DISPONÍVEL!</h2><input id="segundoNome" placeholder="Segundo nome (opcional)" class="w-full bg-black/50 rounded-xl p-3 mt-4 mb-3"><button onclick="pegarExtra()" class="w-full bg-blue-600 py-3 rounded-xl font-black">PEGAR</button></div></div>
  </div>
</div>

<script>
let state=JSON.parse(localStorage.getItem('bingo_v4')||'null')||{sala:null, pool:[], jogadores:[], sorteados:[], premios:[{id:1,tipo:'horizontal'},{id:999,tipo:'cheio',final:true}], iniciada:false};
let marcador='🔴', meuId=localStorage.getItem('bingo_v4_id'), cartelaSel=null;
let codigoUrl=new URLSearchParams(location.search).get('jogo');
const isPlayer=!!codigoUrl;
if(isPlayer){ adminRoot.classList.add('hidden'); playerRoot.classList.remove('hidden'); playerSalaNome.innerText='Sala: '+codigoUrl; }
else if(state.sala) mostrarPainelAdmin();

function gerarCartela(){ const r=[[1,15],[16,30],[31,45],[46,60],[61,75]]; let cols=r.map(([a,b])=>{let arr=[];while(arr.length<5){let n=Math.floor(Math.random()*(b-a+1))+a; if(!arr.includes(n)) arr.push(n);}return arr;}); let card=[]; for(let i=0;i<5;i++){let row=[]; for(let j=0;j<5;j++) row.push(cols[j][i]); card.push(row);} card[2][2]='BINGO'; let m=Array(5).fill(0).map(()=>Array(5).fill(false)); m[2][2]=true; return {id:Date.now()+Math.random(), numeros:card, marcados:m}; }
function criarSala(){ const nome=nomeSala.value||'Bingo'; const total=parseInt(totalCartelas.value)||50; const codigo=Math.random().toString(36).substring(2,6).toUpperCase(); state={sala:{nome,codigo,total}, pool:[], jogadores:[], sorteados:[], premios:[{id:1,tipo:'horizontal'},{id:999,tipo:'cheio',final:true}], iniciada:false}; for(let i=0;i<total;i++) state.pool.push(gerarCartela()); save(); mostrarPainelAdmin(); }
function mostrarPainelAdmin(){ setupSala.classList.add('hidden'); painelAdmin.classList.remove('hidden'); tituloSala.innerText=state.sala.nome; codigoSala.innerText=state.sala.codigo; linkConvite.value=location.origin+location.pathname+'?jogo='+state.sala.codigo; estoqueInfo.innerText=`${state.pool.length} disponíveis / ${state.jogadores.filter(j=>j.status=='pronto').reduce((a,j)=>a+j.cartelas.length,0)} vendidas`; qrcode.innerHTML=''; new QRCode(qrcode,{text:linkConvite.value,width:100,height:100}); renderAdmin(); }
function copiarLink(){ navigator.clipboard.writeText(linkConvite.value); alert('Link copiado'); }
function save(){ localStorage.setItem('bingo_v4', JSON.stringify(state)); if(!isPlayer) renderAdmin(); else renderEscolhaOuJogo(); }
function setMarcador(m){marcador=m; marcadorAtual.innerText=m;}
function addPremio(){ const t=tipoPremio.value; state.premios.pop(); state.premios.push({id:Date.now(),tipo:t}); state.premios.push({id:999,tipo:'cheio',final:true}); save(); }
function sortear(){ if(!state.iniciada) return alert('Inicie a partida'); let disp=[...Array(75)].map((_,i)=>i+1).filter(n=>!state.sorteados.includes(n)); if(!disp.length) return; state.sorteados.push(disp[Math.floor(Math.random()*disp.length)]); save(); }
function iniciarPartida(){ state.iniciada=true; save(); alert('Partida iniciada'); }
function liberarExtra(){ const id=selectJogadorExtra.value; const j=state.jogadores.find(x=>x.id==id); if(!j) return; j.pendenteExtra=(j.pendenteExtra||0)+1; save(); }

function renderAdmin(){
 listaPremios.innerHTML=state.premios.map(p=>`<div class="bg-black/30 p-1 rounded text-xs ${p.final?'bg-blue-600/20':''}">${p.final?'🏁 ':''}${p.tipo.toUpperCase()}</div>`).join('');
 numerosSorteados.innerHTML=state.sorteados.map(n=>`<span class="bg-blue-600 w-6 h-6 rounded-full flex items-center justify-center text-[10px]">${n}</span>`).join('');
 if(state.sorteados.length) ultimoNumero.innerText=state.sorteados[state.sorteados.length-1];
 estoqueInfo.innerText=`${state.pool.length} disponíveis / ${state.jogadores.filter(j=>j.status=='pronto').length} prontos`;
 listaJogadoresAdmin.innerHTML=state.jogadores.map(j=>{
  const cor=j.status=='pronto'?'bg-green-600/30 border-green-500/50 text-green-300':'bg-red-600/30 border-red-500/50 text-red-300';
  const bola=j.status=='pronto'?'🟢':'🔴';
  const nomeDisplay=j.nomes.length>1?j.nomes.join(', '):`${j.nomes[0]} {${j.cartelas.length}}`;
  return `<div class="flex justify-between items-center p-3 rounded-xl border ${cor}"><span>${bola} <b>${nomeDisplay}</b> - ${j.marcador} - ${j.status.toUpperCase()} ${j.pendenteExtra?`⏳${j.pendenteExtra}`:''}</span><button onclick="excluirJogador('${j.id}')" class="text-xs">Excluir</button></div>`;
 }).join('');
 selectJogadorExtra.innerHTML=state.jogadores.filter(j=>j.status=='pronto').map(j=>`<option value="${j.id}">${j.nomes[0]}</option>`).join('');
 let alertHtml=''; state.jogadores.forEach(j=>{ j.cartelas.forEach((card,idx)=>{ state.premios.forEach(p=>{ if(p.final) return; let ok=false; if(p.tipo=='horizontal') ok=card.marcados.some(r=>r.every(x=>x)); if(p.tipo=='vertical') for(let c=0;c<5;c++) if(card.marcados.every(r=>r[c])) ok=true; if(p.tipo=='diagonal') ok=(card.marcados[0][0]&&card.marcados[1][1]&&card.marcados[2][2]&&card.marcados[3][3]&&card.marcados[4][4])||(card.marcados[0][4]&&card.marcados[1][3]&&card.marcados[2][2]&&card.marcados[3][1]&&card.marcados[4][0]); if(p.tipo=='4cantos') ok=card.marcados[0][0]&&card.marcados[0][4]&&card.marcados[4][0]&&card.marcados[4][4]; if(ok) alertHtml+=`<div>⚠️ ${j.nomes.join(', ')} C${idx+1} ${p.tipo}</div>`; }); }); }); alertasBingo.innerHTML=alertHtml||'Nenhum';
}
function excluirJogador(id){ const j=state.jogadores.find(x=>x.id==id); if(j.status=='pronto') state.pool.push(...j.cartelas); state.jogadores=state.jogadores.filter(x=>x.id!=id); save(); }

// PLAYER FLUXO
function entrarNaSala(){
 const nome=nomeJogador.value.trim(); if(!nome) return alert('Nome'); if(nome.toLowerCase()=='admin') return alert('Admin não pode');
 let j={id:Date.now().toString(), nomes:[nome], cartelas:[], marcador, status:'na_sala', pendenteExtra:0};
 state.jogadores.push(j); meuId=j.id; localStorage.setItem('bingo_v4_id', meuId); save();
 playerLogin.classList.add('hidden'); playerEscolha.classList.remove('hidden'); renderEscolhaOuJogo();
}
function renderEscolhaOuJogo(){
 const eu=state.jogadores.find(j=>j.id==meuId); if(!eu) return;
 if(eu.status=='na_sala'){
  playerLogin.classList.add('hidden'); playerEscolha.classList.remove('hidden'); playerCartelas.classList.add('hidden');
  playerNomeDisplay2.innerText=eu.nomes.join(', '); playerEstoque.innerText=state.pool.length+' cartelas disponíveis';
  gridCartelasDisponiveis.innerHTML=state.pool.map((card,idx)=>`<div onclick="selecionarCartela('${card.id}')" id="mini-${card.id}" class="cartela-mini glass rounded-xl p-2 text-[9px]"><div class="grid grid-cols-5 gap-[2px]">${['B','I','N','G','O'].map(l=>`<div class="text-center text-blue-400 font-black text-[8px]">${l}</div>`).join('')}${card.numeros.map(row=>row.map(num=>`<div class="bg-white/5 rounded text-center py-[2px]">${num=='BINGO'?'*':num}</div>`).join('')).join('')}</div></div>`).join('');
 } else if(eu.status=='pronto'){
  playerLogin.classList.add('hidden'); playerEscolha.classList.add('hidden'); playerCartelas.classList.remove('hidden');
  playerNomeDisplay.innerText=eu.nomes.join(', ')+' - '+eu.cartelas.length+' cartela(s)';
  playerUltimoSorteado.innerText=state.sorteados[state.sorteados.length-1]||'--';
  if(eu.pendenteExtra>0) bloqueioExtra.classList.remove('hidden'); else bloqueioExtra.classList.add('hidden');
  gridCartelas.innerHTML=eu.cartelas.map((card,ci)=>`<div class="glass rounded-[1.5rem] p-4"><div class="grid grid-cols-5 gap-1 bg-black/40 p-2 rounded-xl">${['B','I','N','G','O'].map(l=>`<div class="text-center text-blue-400 font-black text-xs">${l}</div>`).join('')}${card.numeros.map((row,r)=>row.map((num,c)=>`<div onclick="marcar(${ci},${r},${c})" class="aspect-square bg-white/5 rounded-lg flex items-center justify-center text-sm relative cursor-pointer ${card.marcados[r][c]?'bg-blue-600/60':''}">${num=='BINGO'?'<span class=text-[8px]>BINGO</span>':num}${card.marcados[r][c]?`<div class=absolute inset-0 flex items-center justify-center text-xl>${eu.marcador}</div>`:''}</div>`).join('')).join('')}</div></div>`).join('');
 }
}
function selecionarCartela(id){
 document.querySelectorAll('.cartela-mini').forEach(el=>el.classList.remove('sel')); document.getElementById('mini-'+id).classList.add('sel');
 cartelaSel=id; cartelaEscolhidaInfo.innerText='Cartela selecionada: '+id.substring(0,4); btnPronto.disabled=false; btnPronto.classList.remove('bg-gray-600','opacity-50'); btnPronto.classList.add('bg-blue-600');
}
function clicarPronto(){
 const eu=state.jogadores.find(j=>j.id==meuId); const idx=state.pool.findIndex(c=>c.id==cartelaSel); if(idx==-1) return alert('Cartela não disponível'); const card=state.pool.splice(idx,1)[0]; eu.cartelas.push(card); eu.status='pronto'; save(); renderEscolhaOuJogo();
}
function marcar(ci,r,c){ const eu=state.jogadores.find(j=>j.id==meuId); if(eu.cartelas[ci].numeros[r][c]=='BINGO') return; eu.cartelas[ci].marcados[r][c]=!eu.cartelas[ci].marcados[r][c]; save(); }
function pegarExtra(){ const eu=state.jogadores.find(j=>j.id==meuId); const seg=segundoNome.value.trim(); if(seg &&!eu.nomes.includes(seg)) eu.nomes.push(seg); if(state.pool.length < eu.pendenteExtra) return alert('Sem estoque'); eu.cartelas.push(...state.pool.splice(0, eu.pendenteExtra)); eu.pendenteExtra=0; save(); }
setInterval(()=>{ if(!isPlayer) renderAdmin(); else renderEscolhaOuJogo(); },2000);
</script>
</body>
</html>
