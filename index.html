<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo B&W - Online Real V2</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{font-family:Space Grotesk,sans-serif}
body{background:#000;color:#fff}
.white-card{background:#fff;color:#000;border:2px solid #000}
.black-card{background:#000;color:#fff;border:2px solid #fff}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:900;border:1px solid #000;background:#fff;color:#000;position:relative;cursor:pointer}
.cell.marked{background:#000;color:#fff}
.cartela{cursor:pointer;border:2px solid #000}
.cartela.sel{border-color:#fff;box-shadow:0 0 0 3px #fff}
</style>
</head>
<body class="min-h-screen p-3">
<div id="setup" class="min-h-screen flex items-center justify-center">
<div class="white-card rounded-[2rem] p-8 w-full max-w-md">
<h1 class="text-4xl font-black text-center">BINGO<span class="bg-black text-white px-3 ml-1">B&W</span></h1>
<p class="text-center text-[11px] font-bold opacity-60 mt-2">V2 - 100% ONLINE REAL COM SERVIDOR</p>
<input id="nomeSala" placeholder="NOME DA SALA" class="w-full border-2 border-black p-4 rounded-xl mt-8 font-bold outline-none">
<input id="totalCartelas" type="number" value="20" min="1" max="100" class="w-full border-2 border-black p-4 rounded-xl mt-3 font-bold">
<button id="btnCriar" onclick="criarSala()" class="w-full bg-black text-white py-4 rounded-xl font-black mt-6">DISPONIBILIZAR CARTELAS</button>
<p id="status" class="text-xs font-bold text-center mt-3"></p>
</div>
</div>

<div id="admin" class="hidden max-w-5xl mx-auto">
<div class="white-card rounded-2xl p-5 flex flex-col md:flex-row justify-between gap-4">
<div class="flex-1"><h2 id="tituloSala" class="text-2xl font-black"></h2><p id="estoqueInfo" class="text-sm font-bold"></p><input id="linkConvite" readonly class="w-full mt-3 border-2 border-black p-3 rounded-xl text-xs font-bold"><div class="flex gap-2 mt-3"><button onclick="copiarLink()" class="bg-black text-white px-5 py-2 rounded-xl text-sm font-black">COPIAR LINK</button><span class="border-2 border-black px-4 py-2 rounded-xl text-sm font-black">CÓDIGO: <b id="codigoSala"></b></span></div></div>
<div class="bg-white p-2 border-2 border-black rounded-xl"><div id="qrcode"></div></div>
</div>
<div class="grid md:grid-cols-12 gap-4 mt-4">
<div class="md:col-span-5"><div class="black-card rounded-2xl p-4"><div id="ultimoNumero" class="text-6xl font-black text-center py-6">--</div><button onclick="sortear()" class="w-full bg-white text-black py-3 rounded-xl font-black">SORTEAR</button><div id="numerosSorteados" class="flex flex-wrap gap-1 mt-3"></div><button id="btnIniciar" onclick="iniciarPartida()" class="w-full mt-4 bg-white text-black py-3 rounded-xl font-black">🚀 INICIAR PARTIDA</button></div></div>
<div class="md:col-span-7 black-card rounded-2xl p-4"><h3 class="font-black">👥 JOGADORES - TEMPO REAL</h3><p class="text-xs opacity-70">🔴 VERMELHO = Entrou (nome+marcador) | 🟢 + ✅ VISTO = Clicou PRONTO</p><p id="onlineStatus" class="text-[10px] font-bold mt-1 text-green-400">● ONLINE</p><div id="listaJogadores" class="mt-4 space-y-2"></div></div>
</div>
</div>

<div id="player" class="hidden max-w-5xl mx-auto">
<div id="playerLogin" class="min-h-screen flex items-center justify-center"><div class="white-card rounded-[2rem] p-8 w-full max-w-md"><h1 class="text-3xl font-black text-center">ENTRAR NA SALA</h1><p id="playerSalaNome" class="text-center text-xs font-bold opacity-60 mt-2"></p><input id="nomeJogador" placeholder="SEU NOME" class="w-full border-2 border-black p-4 rounded-xl mt-6 font-bold"><div class="grid grid-cols-5 gap-2 mt-4"><button onclick="setMarcador('🔴')" class="border-2 border-black p-3 rounded-xl">🔴</button><button onclick="setMarcador('🔵')" class="border-2 border-black p-3 rounded-xl">🔵</button><button onclick="setMarcador('🟢')" class="border-2 border-black p-3 rounded-xl">🟢</button><button onclick="setMarcador('❌')" class="border-2 border-black p-3 rounded-xl">❌</button><button onclick="setMarcador('✅')" class="border-2 border-black p-3 rounded-xl bg-black text-white">✅</button></div><div class="text-center mt-3 font-black">MARCADOR: <span id="marcadorAtual" class="text-2xl">🔴</span></div><button onclick="entrarNaSala()" class="w-full bg-black text-white py-4 rounded-xl font-black mt-6">ENTRAR NA SALA</button></div></div>
<div id="playerEscolha" class="hidden pb-24"><div class="white-card rounded-2xl p-4 mb-4 flex justify-between sticky top-2 z-10"><h2 class="font-black">ESCOLHA SUA CARTELA</h2><span id="playerEstoque" class="font-black"></span></div><div id="gridDisponiveis" class="grid grid-cols-2 md:grid-cols-5 gap-3"></div><div class="fixed bottom-0 left-0 right-0 bg-black border-t-2 border-white p-4 flex justify-between"><span id="escolhidaInfo" class="font-bold text-white">NENHUMA</span><button id="btnPronto" onclick="clicarPronto()" disabled class="bg-[#333] text-[#666] px-10 py-3 rounded-xl font-black">✅ PRONTO</button></div></div>
<div id="playerJogo" class="hidden"><div class="white-card rounded-2xl p-4 flex justify-between mb-4"><span id="playerNomeDisplay" class="font-black"></span><span class="font-black">ÚLTIMO: <b id="playerUltimo">--</b></span></div><div id="gridJogo" class="grid md:grid-cols-2 gap-4 max-w-4xl mx-auto"></div></div>
</div>

<script>
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%1000000; return h; }
function seededRandom(s){ return Math.abs(Math.sin(s)*10000)%1; }
function gerarCartela(seedStr){
  const ranges=[[1,15],[16,30],[31,45],[46,60],[61,75]];
  let base=hash(seedStr);
  let cols=ranges.map(([min,max], ci)=>{ let arr=[]; let t=0; while(arr.length<5){ let n=Math.floor(seededRandom(base+ci*100+t*7)*(max-min+1))+min; if(!arr.includes(n)) arr.push(n); t++; } return arr; });
  let card=[]; for(let r=0;r<5;r++){ let row=[]; for(let c=0;c<5;c++) row.push(cols[c][r]); card.push(row);} card[2][2]='FREE';
  return {id: seedStr, numeros:card, marcados:Array(5).fill(0).map((_,i)=>Array(5).fill(false).map((__,j)=>i==2&&j==2))};
}

let state=null, meuId=localStorage.getItem('bingo_bw_v2_id'), marcador='🔴', cartelaSel=null, npointId=null, codigoSalaAtual=null;
const NPOINT_API='https://api.npoint.io';

async function criarSala(){
  const btn=document.getElementById('btnCriar');
  const status=document.getElementById('status');
  try{
    btn.disabled=true; btn.innerText='CRIANDO SALA ONLINE...'; status.innerText='Conectando no servidor...';
    const nome=document.getElementById('nomeSala').value||'BINGO B&W';
    const total=parseInt(document.getElementById('totalCartelas').value)||20;
    const codigo=Math.random().toString(36).substring(2,6).toUpperCase();
    let pool=[]; for(let i=0;i<total;i++) pool.push(gerarCartela(codigo+'-'+i));
    state={sala:{nome,codigo,total}, pool, jogadores:[], sorteados:[], iniciada:false, created:Date.now()};

    // Cria sala no servidor npoint.io - 100% online
    const res=await fetch(NPOINT_API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(state)});
    if(!res.ok) throw new Error('Falha no servidor');
    const data=await res.json();
    npointId=data.id;
    localStorage.setItem('bingo_npoint_'+codigo, npointId);
    status.innerText='✅ SALA CRIADA COM '+total+' CARTELAS!';
    setTimeout(()=>{ location.href=location.pathname+'?admin='+codigo+'&np='+npointId; },600);
  }catch(e){
    console.error(e);
    status.innerText='Erro: '+e.message+' - Tentando modo local...';
    // Fallback local se npoint falhar
    const nome=document.getElementById('nomeSala').value||'BINGO B&W';
    const total=parseInt(document.getElementById('totalCartelas').value)||20;
    const codigo=Math.random().toString(36).substring(2,6).toUpperCase();
    let pool=[]; for(let i=0;i<total;i++) pool.push(gerarCartela(codigo+'-'+i));
    state={sala:{nome,codigo,total}, pool, jogadores:[], sorteados:[], iniciada:false};
    localStorage.setItem('bingo_room_'+codigo, JSON.stringify(state));
    setTimeout(()=>{ location.href=location.pathname+'?admin='+codigo; },600);
  }
}

async function fetchState(){
  if(!npointId) return null;
  try{
    const res=await fetch(NPOINT_API+'/'+npointId);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

async function saveState(){
  if(!npointId ||!state) return;
  try{
    await fetch(NPOINT_API+'/'+npointId, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(state)});
  }catch(e){ console.error('Erro ao salvar',e); }
  // Também salva local
  localStorage.setItem('bingo_room_'+state.sala.codigo, JSON.stringify(state));
}

function setMarcador(m){ marcador=m; document.getElementById('marcadorAtual').innerText=m; }

async function mostrarAdmin(codigo, np){
  codigoSalaAtual=codigo; npointId=np||localStorage.getItem('bingo_npoint_'+codigo);
  if(!npointId){
    // tenta local
    state=JSON.parse(localStorage.getItem('bingo_room_'+codigo)||'null');
    if(!state){ alert('Sala não encontrada'); location.href=location.pathname; return; }
  } else {
    state=await fetchState();
  }
  if(!state) return;
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('admin').classList.remove('hidden');
  document.getElementById('tituloSala').innerText=state.sala.nome;
  document.getElementById('codigoSala').innerText=state.sala.codigo;
  const link=location.origin+location.pathname+'?jogo='+state.sala.codigo+'&total='+state.sala.total+'&np='+npointId;
  document.getElementById('linkConvite').value=link;
  document.getElementById('qrcode').innerHTML=''; new QRCode(document.getElementById('qrcode'), {text:link, width:110, height:110});
  renderAdmin();
  // Listener tempo real a cada 1.5s
  setInterval(async()=>{
    const fresh=npointId? await fetchState() : JSON.parse(localStorage.getItem('bingo_room_'+codigo)||'null');
    if(fresh){ state=fresh; renderAdmin(); }
  },1500);
}

function renderAdmin(){
  if(!state) return;
  const disp=state.pool.filter(c=>!state.jogadores.some(j=>j.cartelas.some(jc=>jc.id===c.id)));
  document.getElementById('estoqueInfo').innerText=`DISPONIBILIZADAS: ${state.sala.total} | LIVRES: ${disp.length} | JOGADORES: ${state.jogadores.length}`;
  document.getElementById('numerosSorteados').innerHTML=state.sorteados.map(n=>`<span class="bg-black text-white border border-white w-7 h-7 rounded-full flex items-center justify-center text-xs font-black">${n}</span>`).join('');
  if(state.sorteados.length) document.getElementById('ultimoNumero').innerText=state.sorteados[state.sorteados.length-1];
  document.getElementById('listaJogadores').innerHTML=state.jogadores.map(j=>{
    const isPronto=j.status==='pronto';
    const cor=isPronto?'bg-white text-black border-2 border-black':'bg-[#111] text-white border border-red-500';
    const bola=isPronto?'🟢':'🔴';
    const visto=isPronto?'✅ VISTO':'';
    return `<div class="p-3 rounded-xl ${cor}"><span class="font-black text-sm">${bola} ${j.nomes.join(', ')} {${j.cartelas.length}} - ${j.marcador} - ${j.status.toUpperCase()} ${visto}</span></div>`;
  }).join('') || '<p class="text-xs opacity-60">Nenhum jogador entrou. Envie o link para outro celular.</p>';
}

async function initPlayer(codigo, np, total){
  codigoSalaAtual=codigo; npointId=np||localStorage.getItem('bingo_npoint_'+codigo);
  if(npointId){
    state=await fetchState();
  }
  if(!state){
    const totalFinal=total||20;
    let pool=[]; for(let i=0;i<totalFinal;i++) pool.push(gerarCartela(codigo+'-'+i));
    state={sala:{nome:'Sala '+codigo, codigo, total:totalFinal}, pool, jogadores:[], sorteados:[], iniciada:false};
  }
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('player').classList.remove('hidden');
  document.getElementById('playerSalaNome').innerText=`SALA ${codigo} - ${state.sala.total} CARTELAS`;
  setInterval(async()=>{
    const fresh=npointId? await fetchState() : JSON.parse(localStorage.getItem('bingo_room_'+codigo)||'null');
    if(fresh){ state=fresh; if(meuId) renderPlayer(); }
  },1500);
  if(meuId && state.jogadores.find(j=>j.id===meuId)) renderPlayer();
}

async function entrarNaSala(){
  const nome=document.getElementById('nomeJogador').value.trim(); if(!nome) return alert('NOME');
  let j={id:Date.now().toString(), nomes:[nome], cartelas:[], marcador, status:'na_sala'};
  state.jogadores.push(j); meuId=j.id; localStorage.setItem('bingo_bw_v2_id', meuId);
  await saveState();
  renderPlayer();
}

function renderPlayer(){
  const eu=state.jogadores.find(j=>j.id===meuId); if(!eu) return;
  if(eu.status==='na_sala'){
    document.getElementById('playerLogin').classList.add('hidden');
    document.getElementById('playerEscolha').classList.remove('hidden');
    document.getElementById('playerJogo').classList.add('hidden');
    const disp=state.pool.filter(c=>!state.jogadores.some(j=>j.cartelas.some(jc=>jc.id===c.id)));
    document.getElementById('playerEstoque').innerText=disp.length;
    document.getElementById('gridDisponiveis').innerHTML=disp.map(card=>`
      <div onclick="selecionarCartela('${card.id}')" id="mini-${card.id}" class="cartela white-card rounded-xl p-2"><div class="grid grid-cols-5 gap-[2px]">${card.numeros.map((row,r)=>row.map((num,c)=>`<div class="text-[9px] text-center py-1 border border-black ${r==2&&c==2?'bg-black text-white':'bg-white text-black'}">${num==='FREE'?'★':num}</div>`).join('')).join('')}</div></div>`).join('') || '<p class="col-span-5 text-center py-10">Acabaram as cartelas!</p>';
  } else {
    document.getElementById('playerLogin').classList.add('hidden');
    document.getElementById('playerEscolha').classList.add('hidden');
    document.getElementById('playerJogo').classList.remove('hidden');
    document.getElementById('playerNomeDisplay').innerText=eu.nomes.join(', ')+' - '+eu.cartelas.length+' CARTELA(S) ✅';
    document.getElementById('playerUltimo').innerText=state.sorteados[state.sorteados.length-1]||'--';
    document.getElementById('gridJogo').innerHTML=eu.cartelas.map((card,ci)=>`<div class="white-card rounded-[1.5rem] p-4"><div class="grid grid-cols-5 gap-1">${['B','I','N','G','O'].map(l=>`<div class="text-center font-black text-xs">${l}</div>`).join('')}${card.numeros.map((row,r)=>row.map((num,c)=>`<div onclick="marcar(${ci},${r},${c})" class="cell ${card.marcados[r][c]?'marked':''}">${num==='FREE'?'★':num}${card.marcados[r][c]?`<div class="absolute inset-0 flex items-center justify-center text-xl">${eu.marcador}</div>`:''}</div>`).join('')).join('')}</div></div>`).join('');
  }
}

function selecionarCartela(id){ document.querySelectorAll('.cartela').forEach(el=>el.classList.remove('sel')); document.getElementById('mini-'+id)?.classList.add('sel'); cartelaSel=id; document.getElementById('escolhidaInfo').innerText=id.slice(-4); const btn=document.getElementById('btnPronto'); btn.disabled=false; btn.classList.remove('bg-[#333]','text-[#666]'); btn.classList.add('bg-white','text-black'); }
async function clicarPronto(){ const eu=state.jogadores.find(j=>j.id===meuId); if(!eu||!cartelaSel) return; const card=state.pool.find(c=>c.id===cartelaSel); if(!card) return alert('JÁ FOI PEGA'); if(state.jogadores.some(j=>j.cartelas.some(jc=>jc.id===card.id))) return alert('JÁ ESCOLHIDA'); eu.cartelas.push(JSON.parse(JSON.stringify(card))); eu.status='pronto'; cartelaSel=null; await saveState(); renderPlayer(); }
async function marcar(ci,r,c){ const eu=state.jogadores.find(j=>j.id===meuId); if(eu.cartelas[ci].numeros[r][c]==='FREE') return; eu.cartelas[ci].marcados[r][c]=!eu.cartelas[ci].marcados[r][c]; await saveState(); renderPlayer(); }
async function sortear(){ if(!state) return; if(!state.iniciada) state.iniciada=true; let disp=[...Array(75)].map((_,i)=>i+1).filter(n=>!state.sorteados.includes(n)); if(!disp.length) return; state.sorteados.push(disp[Math.floor(Math.random()*disp.length)]); await saveState(); renderAdmin(); }
async function iniciarPartida(){ if(!state) return; state.iniciada=true; await saveState(); document.getElementById('btnIniciar').innerText='✅ PARTIDA INICIADA'; }
function copiarLink(){ navigator.clipboard.writeText(document.getElementById('linkConvite').value); alert('Link copiado!'); }

const params=new URLSearchParams(location.search);
if(params.get('admin')){ mostrarAdmin(params.get('admin'), params.get('np')); }
else if(params.get('jogo')){ initPlayer(params.get('jogo'), params.get('np'), parseInt(params.get('total'))||0); }
</script>
</body>
</html>
