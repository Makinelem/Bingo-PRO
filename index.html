<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Feliz - Convites</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
 body{background:#0a0f1f; font-family: sans-serif}
.glass{background:rgba(255,255,255,0.06); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1)}
</style>
</head>
<body class="text-white min-h-screen p-4">

<div id="adminRoot" class="max-w-6xl mx-auto">
  <!-- SETUP INICIAL ADMIN -->
  <div id="setupSala" class="glass rounded-3xl p-8 max-w-2xl mx-auto mt-20 text-center">
    <h1 class="text-4xl font-black mb-2">BINGO FELIZ</h1>
    <p class="opacity-60 mb-8">Crie a sala e gere as cartelas para distribuir</p>
    <input id="nomeSala" placeholder="Nome da festa / jogo" class="w-full bg-black/50 p-4 rounded-xl mb-3">
    <input id="totalCartelas" type="number" value="100" class="w-full bg-black/50 p-4 rounded-xl mb-6">
    <button onclick="criarSala()" class="w-full bg-blue-600 py-4 rounded-xl font-black text-xl">CRIAR SALA E GERAR CARTELAS</button>
  </div>

  <div id="painelAdmin" class="hidden grid grid-cols-12 gap-4">
    <div class="col-span-12 glass rounded-2xl p-6 flex flex-col lg:flex-row justify-between gap-6">
      <div>
        <h2 class="text-2xl font-black" id="tituloSala"></h2>
        <p class="opacity-60">Estoque: <span id="estoqueInfo"></span></p>
        <div class="mt-4 flex gap-2">
          <button onclick="copiarLink()" class="bg-white text-black px-6 py-3 rounded-xl font-bold">📋 Copiar Link do Convite</button>
          <button onclick="copiarCodigo()" class="glass px-6 py-3 rounded-xl font-bold">Código: <span id="codigoSala"></span></button>
        </div>
        <input id="linkConvite" readonly class="w-full mt-3 bg-black/50 p-3 rounded-lg text-xs opacity-70">
      </div>
      <div class="bg-white p-3 rounded-xl"><div id="qrcode"></div></div>
    </div>

    <!-- Resto do admin igual V2: sorteio, prêmios, jogadores, liberar extra -->
    <div class="col-span-12 lg:col-span-5 glass rounded-2xl p-5">
      <h3 class="font-bold mb-3">🏆 Prêmios Livres</h3>
      <div id="listaPremios"></div>
      <div class="flex gap-2 mt-3">
        <select id="tipoPremio" class="bg-black/50 rounded-lg p-2 flex-1"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="diagonal">Diagonal</option><option value="4cantos">4 Cantos</option></select>
        <button onclick="addPremio()" class="bg-blue-600 px-4 rounded-lg">+ Add</button>
      </div>
      <div class="mt-6">
        <h3 class="font-bold">🎱 Sorteio</h3>
        <div id="ultimoNumero" class="text-6xl font-black text-center py-4 text-blue-400">--</div>
        <button onclick="sortear()" class="w-full bg-white text-black py-3 rounded-xl font-black">SORTEAR</button>
        <div id="numerosSorteados" class="flex flex-wrap gap-1 mt-3"></div>
      </div>
    </div>
    <div class="col-span-12 lg:col-span-7 space-y-4">
      <div class="glass rounded-2xl p-5 bg-yellow-500/10">
        <h3 class="font-bold text-yellow-300">⚠️ BINGOS PARA VALIDAR (só você vê)</h3>
        <div id="alertasBingo" class="mt-2 text-sm">Aguardando...</div>
      </div>
      <div class="glass rounded-2xl p-5">
        <h3 class="font-bold">👥 Jogadores / Vendas</h3>
        <div id="listaJogadoresAdmin" class="mt-3 space-y-2"></div>
        <div class="mt-4 border-t border-white/10 pt-3 flex gap-2">
          <select id="selectJogadorExtra" class="bg-black/50 rounded-lg p-2 flex-1"></select>
          <input id="qtdExtra" type="number" value="1" class="bg-black/50 w-20 rounded-lg p-2">
          <button onclick="liberarExtra()" class="bg-green-600 px-4 rounded-lg font-bold">Liberar Extra</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="playerRoot" class="hidden min-h-screen">
  <div class="max-w-xl mx-auto">
    <div id="playerLogin" class="glass rounded-[2rem] p-8 mt-10">
      <div class="text-center mb-6"><h1 class="text-3xl font-black">BEM-VINDO AO BINGO</h1><p class="opacity-60" id="playerSalaNome"></p><p class="text-xs mt-2 bg-blue-600/20 p-2 rounded-lg">Convite válido - Modo Jogador</p></div>
      <input id="nomeJogador" placeholder="Seu nome completo" class="w-full bg-black/50 rounded-xl p-4 mb-3">
      <input id="qtdCartelas" type="number" value="1" min="1" class="w-full bg-black/50 rounded-xl p-4 mb-4">
      <p class="text-sm opacity-60 mb-2">Marcador:</p>
      <div class="grid grid-cols-5 gap-2 mb-4"><button onclick="setMarcador('🔴')" class="glass p-3 rounded-xl">🔴</button><button onclick="setMarcador('🔵')" class="glass p-3 rounded-xl">🔵</button><button onclick="setMarcador('🟢')" class="glass p-3 rounded-xl">🟢</button><button onclick="setMarcador('❌')" class="glass p-3 rounded-xl">❌</button><button onclick="setMarcador('❤️')" class="glass p-3 rounded-xl">❤️</button></div>
      <div class="text-center mb-4">Escolhido: <span id="marcadorAtual">🔴</span></div>
      <button onclick="entrarJogo()" class="w-full bg-blue-600 py-4 rounded-xl font-black">PRONTO - ENTRAR</button>
    </div>
    <div id="bloqueioExtra" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-6"><div class="glass rounded-3xl p-10 text-center max-w-sm w-full border-blue-400"><h2 class="text-3xl font-black">🎉 NOVA CARTELA DISPONÍVEL!</h2><input id="segundoNome" placeholder="Segundo nome (opcional)" class="w-full bg-black/50 rounded-xl p-3 mt-6 mb-3"><button onclick="pegarExtra()" class="w-full bg-blue-600 py-4 rounded-xl font-black">PEGAR</button><button onclick="ignorarExtra()" class="w-full mt-2 glass py-3 rounded-xl">Ignorar</button></div></div>
    <div id="playerCartelas" class="hidden"><div class="glass rounded-xl p-4 flex justify-between mb-4"><span id="playerNomeDisplay"></span><span id="playerUltimoSorteado" class="font-black text-blue-400">--</span></div><div id="gridCartelas" class="grid gap-4"></div></div>
  </div>
</div>

<script>
let state = JSON.parse(localStorage.getItem('bingo_v3')||'null') || {sala:null, cartelasPool:[], jogadores:[], sorteados:[], premios:[{id:999,tipo:'cheio',final:true}]};
let marcador='🔴'; let meuId=localStorage.getItem('bingo_meuId');
let codigoAtual = new URLSearchParams(window.location.search).get('jogo');

function isPlayerLink(){ return!!codigoAtual; }
if(isPlayerLink()){
  document.getElementById('adminRoot').classList.add('hidden');
  document.getElementById('playerRoot').classList.remove('hidden');
  document.getElementById('playerSalaNome').innerText = 'Sala: '+codigoAtual;
} else {
  document.getElementById('adminRoot').classList.remove('hidden');
  if(state.sala){ mostrarPainelAdmin(); }
}

function gerarCartela(){
  const ranges=[[1,15],[16,30],[31,45],[46,60],[61,75]];
  let cols=ranges.map(([min,max])=>{ let n=[]; while(n.length<5){ let v=Math.floor(Math.random()*(max-min+1))+min; if(!n.includes(v)) n.push(v);} return n; });
  let card=[]; for(let r=0;r<5;r++){ let row=[]; for(let c=0;c<5;c++) row.push(cols[c][r]); card.push(row);} card[2][2]='BINGO';
  return {numeros:card, marcados:Array(5).fill(0).map(()=>Array(5).fill(false)).map((r,i)=>r.map((c,j)=>i==2&&j==2))};
}
function criarSala(){
  const nome=document.getElementById('nomeSala').value||'Bingo da Família';
  const total=parseInt(document.getElementById('totalCartelas').value)||100;
  const codigo=Math.random().toString(36).substring(2,7).toUpperCase();
  state.sala={nome, codigo, total}; state.cartelasPool=[]; for(let i=0;i<total;i++) state.cartelasPool.push(gerarCartela());
  state.jogadores=[]; state.sorteados=[]; save(); mostrarPainelAdmin();
}
function mostrarPainelAdmin(){
  document.getElementById('setupSala').classList.add('hidden'); document.getElementById('painelAdmin').classList.remove('hidden');
  document.getElementById('tituloSala').innerText=state.sala.nome;
  document.getElementById('codigoSala').innerText=state.sala.codigo;
  const link = window.location.origin + window.location.pathname + '?jogo='+state.sala.codigo;
  document.getElementById('linkConvite').value=link;
  document.getElementById('estoqueInfo').innerText=`${state.cartelasPool.length} disponíveis / ${state.jogadores.reduce((a,j)=>a+j.cartelas.length,0)} vendidas`;
  document.getElementById('qrcode').innerHTML=''; new QRCode(document.getElementById('qrcode'), {text:link, width:120, height:120});
  renderAdmin();
}
function copiarLink(){ navigator.clipboard.writeText(document.getElementById('linkConvite').value); alert('Link copiado! Manda no WhatsApp dos jogadores'); }
function copiarCodigo(){ navigator.clipboard.writeText(state.sala.codigo); }
function save(){ localStorage.setItem('bingo_v3', JSON.stringify(state)); if(!isPlayerLink()) renderAdmin(); else renderPlayer(); }
function setMarcador(m){ marcador=m; document.getElementById('marcadorAtual').innerText=m; }

// ADMIN FUNCS (igual V2 resumido)
function addPremio(){ const t=document.getElementById('tipoPremio').value; state.premios.pop(); state.premios.push({id:Date.now(), tipo:t}); state.premios.push({id:999,tipo:'cheio',final:true}); save(); }
function sortear(){ let disp=[...Array(75)].map((_,i)=>i+1).filter(n=>!state.sorteados.includes(n)); if(!disp.length) return; state.sorteados.push(disp[Math.floor(Math.random()*disp.length)]); save(); }
function liberarExtra(){ const id=document.getElementById('selectJogadorExtra').value; const q=parseInt(document.getElementById('qtdExtra').value); const j=state.jogadores.find(x=>x.id==id); j.pendenteExtra=(j.pendenteExtra||0)+q; save(); }
function excluirJogador(id){ if(confirm('Excluir? Devolve cartelas pro estoque')){ const j=state.jogadores.find(x=>x.id==id); state.cartelasPool.push(...j.cartelas); state.jogadores=state.jogadores.filter(x=>x.id!=id); save(); } }

function renderAdmin(){
  document.getElementById('listaPremios').innerHTML=state.premios.map(p=>`<div class="flex justify-between bg-black/30 p-2 rounded-lg text-sm"><span>${p.final?'🏁 ':''}${p.tipo.toUpperCase()}</span></div>`).join('');
  document.getElementById('numerosSorteados').innerHTML=state.sorteados.map(n=>`<span class="bg-blue-600 w-7 h-7 rounded-full flex items-center justify-center text-xs">${n}</span>`).join('');
  if(state.sorteados.length) document.getElementById('ultimoNumero').innerText=state.sorteados[state.sorteados.length-1];
  document.getElementById('listaJogadoresAdmin').innerHTML=state.jogadores.map(j=>`<div class="flex justify-between bg-black/30 p-3 rounded-xl"><span><b>${j.nomes.join(', ')}</b> {${j.cartelas.length}} - ${j.marcador} ${j.pendenteExtra?`⏳${j.pendenteExtra}`:''}</span><button onclick="excluirJogador('${j.id}')" class="text-red-400">X</button></div>`).join('');
  document.getElementById('selectJogadorExtra').innerHTML=state.jogadores.map(j=>`<option value="${j.id}">${j.nomes[0]} {${j.cartelas.length}}</option>`).join('');
  if(state.sala) document.getElementById('estoqueInfo').innerText=`${state.cartelasPool.length} disponíveis / ${state.jogadores.reduce((a,j)=>a+j.cartelas.length,0)} vendidas`;
  // bingo check
  let alertHtml=''; state.jogadores.forEach(j=>{ j.cartelas.forEach((card, idx)=>{ state.premios.forEach(p=>{ if(p.final) return; let ok=false; if(p.tipo=='horizontal') ok=card.marcados.some(r=>r.every(m=>m)); if(p.tipo=='vertical') for(let c=0;c<5;c++) if(card.marcados.every(r=>r[c])) ok=true; if(p.tipo=='diagonal') ok=(card.marcados[0][0]&&card.marcados[1][1]&&card.marcados[2][2]&&card.marcados[3][3]&&card.marcados[4][4])||(card.marcados[0][4]&&card.marcados[1][3]&&card.marcados[2][2]&&card.marcados[3][1]&&card.marcados[4][0]); if(p.tipo=='4cantos') ok=card.marcados[0][0]&&card.marcados[0][4]&&card.marcados[4][0]&&card.marcados[4][4]; if(ok) alertHtml+=`<div class="bg-yellow-500/20 p-2 rounded-lg mb-1">⚠️ ${j.nomes.join(', ')} - Cartela ${idx+1} - ${p.tipo}</div>`; }); if(card.marcados.flat().every(m=>m)) alertHtml+=`<div class="bg-green-500/20 p-2 rounded-lg font-black">🏁 CHEIO: ${j.nomes.join(', ')} C${idx+1}</div>`; }); }); document.getElementById('alertasBingo').innerHTML=alertHtml||'Nenhum possível bingo';
}

// PLAYER FUNCS
function entrarJogo(){
  const nome=document.getElementById('nomeJogador').value.trim(); const qtd=parseInt(document.getElementById('qtdCartelas').value)||1;
  if(!nome) return alert('Nome');
  if(state.cartelasPool.length<qtd) return alert('Acabou o estoque! Fala com o admin');
  let j={id:Date.now().toString(), nomes:[nome], cartelas:state.cartelasPool.splice(0,qtd), marcador, pendenteExtra:0};
  state.jogadores.push(j); meuId=j.id; localStorage.setItem('bingo_meuId', meuId); save();
  document.getElementById('playerLogin').classList.add('hidden'); document.getElementById('playerCartelas').classList.remove('hidden'); renderPlayer();
}
function renderPlayer(){
  const eu=state.jogadores.find(j=>j.id==meuId); if(!eu) return;
  document.getElementById('playerLogin').classList.add('hidden'); document.getElementById('playerCartelas').classList.remove('hidden');
  document.getElementById('playerNomeDisplay').innerText=eu.nomes.join(', '); document.getElementById('playerUltimoSorteado').innerText=state.sorteados[state.sorteados.length-1]||'--';
  if(eu.pendenteExtra>0) document.getElementById('bloqueioExtra').classList.remove('hidden'); else document.getElementById('bloqueioExtra').classList.add('hidden');
  document.getElementById('gridCartelas').innerHTML=eu.cartelas.map((card, idx)=>`<div class="glass rounded-2xl p-3"><div class="grid grid-cols-5 gap-1 bg-black/40 p-2 rounded-xl">${['B','I','N','G','O'].map(l=>`<div class="text-center text-blue-400 font-black text-xs">${l}</div>`).join('')}${card.numeros.map((row,r)=>row.map((num,c)=>`<div onclick="marcar(${idx},${r},${c})" class="aspect-square bg-white/5 rounded-lg flex items-center justify-center text-sm relative ${card.marcados[r][c]?'bg-blue-600/50':''}">${num==='BINGO'?'<span class=text-[9px]>BINGO</span>':num}${card.marcados[r][c]?`<div class="absolute inset-0 flex items-center justify-center text-lg">${eu.marcador}</div>`:''}</div>`).join('')).join('')}</div></div>`).join('');
}
function marcar(ci,r,c){ const eu=state.jogadores.find(j=>j.id==meuId); if(eu.cartelas[ci].numeros[r][c]=='BINGO') return; eu.cartelas[ci].marcados[r][c]=!eu.cartelas[ci].marcados[r][c]; save(); }
function pegarExtra(){ const eu=state.jogadores.find(j=>j.id==meuId); const seg=document.getElementById('segundoNome').value.trim(); if(seg &&!eu.nomes.includes(seg)) eu.nomes.push(seg); if(state.cartelasPool.length < eu.pendenteExtra) return alert('Estoque acabou'); eu.cartelas.push(...state.cartelasPool.splice(0, eu.pendenteExtra)); eu.pendenteExtra=0; save(); }
function ignorarExtra(){ const eu=state.jogadores.find(j=>j.id==meuId); eu.pendenteExtra=0; save(); }

setInterval(()=>{ if(!isPlayerLink()) renderAdmin(); else renderPlayer(); },2000);
if(state.sala &&!isPlayerLink()) mostrarPainelAdmin();
if(isPlayerLink() && meuId) renderPlayer();
</script>
</body>
</html>
