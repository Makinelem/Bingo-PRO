<html lang="pt-BR">

<style>
.cell-square{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; position:relative;}

<div id="modalPremio" class="fixed inset-0 bg-black/90 z-[70] hidden items-center justify-center p-4"><div class="bg-white text-black rounded-[24px] p-8 w-full max-w-md text-center"><h1 class="text-4xl font-black mb-2">🎉 PARABÉNS!!!</h1><p class="text-xl font-bold">Você ganhou!!!</p><p id="textoPremio" class="text-sm mt-3 opacity-70"></p><button onclick="fecharPremio()" class="mt-6 w-full bg-black text-white rounded-xl py-3 font-black">FECHAR</button></div></div>
<div id="modalConferir" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center p-4"><div class="bg-white text-black rounded-[20px] p-6 w-full max-w-lg"><h2 class="text-2xl font-black mb-1">🔍 Conferir Bingo</h2><textarea id="inputConferir" class="w-full bg-zinc-100 rounded-xl p-4 font-mono text-sm h-28 border-2 border-black" placeholder="Ex: 5 12 33 48 70"></textarea><div id="resultadoConferir" class="mt-4 p-3 rounded-xl hidden"></div><div id="areaPremiar" class="hidden mt-3"></div><div class="flex gap-2 mt-4"><button onclick="checarBingo()" class="flex-1 bg-black text-white rounded-xl py-3 font-black">CHECAR</button><button onclick="fecharConferirContinuar()" class="flex-1 bg-zinc-200 text-black rounded-xl py-3 font-black">FECHAR</button></div></div></div>

<script>
const PEER_CONFIG={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}};
let peer=null, connAdmin=null, conexoes={}, souAdmin=false, codigoSala=null, meuId=null, meuNome=null, corIcone='#000000', meuLimiteAnterior=1;
let modoEscolhaExtra=false; let marcadorSelecionado='check';
let estadoSala={nome:'', total:20, limitePadrao:1, cartelas:[], jogadores:[], numerosSorteados:[], status:'lobby', cartelasPremiadas:[]};
let intervaloGiro=null; let cartelaPremiadaTemp=null;
const ICONES={
check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5l10-10"/></svg>`,
x:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
heart:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.5-4.35-9-8.5A5.5 5.5 0 0 1 12 5a5.5 5.5 0 0 1 9 7.5c-2.5 4.15-9 8.5-9 8.5z"/></svg>`,
circle:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="9"/></svg>`,
star:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.5L22 9.3l-5 5 1.2 7L12 18l-6.2 3.3L7 14.3l-5-5 7.1-.8L12 2z"/></svg>`
};
function renderIconGrid(){ const g=document.getElementById('iconGrid'); if(!g) return; g.innerHTML=''; Object.keys(ICONES).forEach(k=>{ const b=document.createElement('button'); b.className='icon-option border-2 rounded-xl p-3 flex items-center justify-center '+(k===marcadorSelecionado?'border-black bg-zinc-100':'border-zinc-200'); b.innerHTML=ICONES[k]; b.style.color=corIcone; b.onclick=()=>{ marcadorSelecionado=k; renderIconGrid(); atualizarPreview(); }; g.appendChild(b); }); }
function atualizarPreview(){ const el=document.getElementById('marcadorModalDisplay'); if(el){ el.innerHTML=ICONES[marcadorSelecionado]; el.style.color=corIcone; } }
function setCorIcone(c){ corIcone=c; renderIconGrid(); atualizarPreview(); }
setTimeout(()=>{ renderIconGrid(); atualizarPreview(); },100);
function genCartelas(total){ const cartelas=[]; function faixa(min,max,qtd){ const arr=[...Array(max-min+1).keys()].map(i=>i+min); return arr.sort(()=>0.5-Math.random()).slice(0,qtd); } for(let i=0;i<total;i++){ const colB=faixa(1,15,5), colI=faixa(16,30,5), colN=faixa(31,45,4), colG=faixa(46,60,5), colO=faixa(61,75,5); const grid=[]; let idxN=0; for(let r=0;r<5;r++){ let row=[]; row.push(colB[r]); row.push(colI[r]); if(r===2) row.push('BINGO FELIZ'); else row.push(colN[idxN++]); row.push(colG[r]); row.push(colO[r]); grid.push(row); } cartelas.push({id:i+1, numero:String(i+1).padStart(2,'0'), grid, donoId:null, donoNome:null}); } return cartelas; }
function getLimite(j){return j.limite!=null? j.limite : estadoSala.limitePadrao;}
function criarPeerAdmin(codigo){ peer=new Peer('bingo-'+codigo, PEER_CONFIG); peer.on('open', ()=>{ document.getElementById('statusConexao').innerText='ADMIN ONLINE'; peer.on('connection', conn=>{ conn.on('open', ()=>{ conexoes[conn.peer]=conn; conn.on('data', d=>handleDataAdmin(d,conn)); conn.on('close', ()=>{ delete conexoes[conn.peer]; broadcastEstado(); }); conn.send({type:'estado', estado:estadoSala}); }); }); peer.on('disconnected', ()=>peer.reconnect()); }); }
function criarSala(){ const senha=document.getElementById('inputSenha').value; if(senha!=='M@ki0110'){ alert('Senha incorreta!'); return; } const nome=document.getElementById('inputNomeSala').value||'Bingo Feliz'; const total=parseInt(document.getElementById('inputTotal').value)||20; const limite=parseInt(document.getElementById('inputLimite').value)||1; const codigo=Math.random().toString(36).substring(2,7).toUpperCase()+'-'+Math.random().toString(36).substring(2,4).toUpperCase(); estadoSala={nome, total, limitePadrao:limite, cartelas:genCartelas(total), jogadores:[], numerosSorteados:[], status:'lobby', codigo, cartelasPremiadas:[]}; localStorage.setItem('bingo_estado_'+codigo, JSON.stringify(estadoSala)); codigoSala=codigo; souAdmin=true; meuId='admin-'+codigo; const link=location.origin+location.pathname+'?sala='+codigo; const linkAdmin=location.origin+location.pathname+'?sala='+codigo+'&admin=1'; document.getElementById('txtLink').innerText=link; document.getElementById('txtLinkAdmin').innerText='ADMIN: '+linkAdmin; document.getElementById('qrcodeHome').innerHTML=''; new QRCode(document.getElementById('qrcodeHome'), {text:link, width:120, height:120}); document.getElementById('home-criar').classList.add('hidden'); document.getElementById('home-link').classList.remove('hidden'); window._linkSala=link; criarPeerAdmin(codigo); }
function copiarWhats(){navigator.clipboard.writeText(`🎉 Bingo Feliz!\nSala: ${estadoSala.nome}\nLink: ${window._linkSala}`);alert('Copiado');}
function entrarComoAdmin(){ document.getElementById('tela-home').classList.add('hidden'); document.getElementById('tela-sala').classList.remove('hidden'); document.getElementById('modalNome').classList.add('hidden'); document.getElementById('painelAdmin').classList.remove('hidden'); document.getElementById('painelSorteadosAdmin').classList.remove('hidden'); souAdmin=true; meuId='admin-'+codigoSala; document.getElementById('nomeSalaDisplay').innerText=estadoSala.nome; document.getElementById('codigoDisplay').innerText='Sala: '+codigoSala; render(); }
const params=new URLSearchParams(location.search);
if(params.get('sala')){ document.getElementById('tela-home').classList.add('hidden'); document.getElementById('tela-sala').classList.remove('hidden'); codigoSala=params.get('sala'); if(params.get('admin')==='1'){ const saved=localStorage.getItem('bingo_estado_'+codigoSala); if(saved){ estadoSala=JSON.parse(saved); if(!estadoSala.cartelasPremiadas) estadoSala.cartelasPremiadas=[]; } souAdmin=true; meuId='admin-'+codigoSala; iniciarPeerAdmin(); } else { iniciarPeerJogador(); document.getElementById('btnCopiarLink').classList.add('hidden'); } document.getElementById('codigoDisplay').innerText='Sala: '+codigoSala; }
function iniciarPeerAdmin(){ if(peer) return; peer=new Peer('bingo-'+codigoSala, PEER_CONFIG); peer.on('open', ()=>{ document.getElementById('painelAdmin').classList.remove('hidden'); document.getElementById('painelSorteadosAdmin').classList.remove('hidden'); document.getElementById('modalNome').classList.add('hidden'); document.getElementById('meuNomeDisplay').innerText='Admin'; document.getElementById('nomeSalaDisplay').innerText=estadoSala.nome; peer.on('connection', conn=>{ conexoes[conn.peer]=conn; conn.on('open', ()=>{ conn.on('data', d=>handleDataAdmin(d,conn)); conn.send({type:'estado', estado:estadoSala}); }); }); peer.on('disconnected', ()=>peer.reconnect()); render(); }); }
function iniciarPeerJogador(){
  const sala=codigoSala; const sessao=localStorage.getItem('bingo_sessao_'+sala); let dados=null; if(sessao){ try{ dados=JSON.parse(sessao);}catch(e){} }
  document.getElementById('modalInfo').innerText='Sala: '+sala;
  if(dados && dados.nome){ document.getElementById('modalInputNome').value=dados.nome; marcadorSelecionado=dados.marcadorTipo||'check'; corIcone=dados.cor||'#000'; renderIconGrid(); atualizarPreview(); }
  peer=new Peer(PEER_CONFIG);
  peer.on('open', myId=>{
    meuId=myId;
    connAdmin=peer.connect('bingo-'+sala, {reliable:true});
    connAdmin.on('open', ()=>{
      document.getElementById('statusConexao').innerText='CONECTADO';
      connAdmin.on('data', d=>handleDataJogador(d));
      if(dados && dados.nome){ meuNome=dados.nome; document.getElementById('meuNomeDisplay').innerText=meuNome; document.getElementById('modalNome').classList.add('hidden'); connAdmin.send({type:'entrar', nome:meuNome, id:meuId, marcadorTipo:marcadorSelecionado, cor:corIcone, online:true, reconexao:true}); }
    });
  });
}
function confirmarNome(){ const nome=document.getElementById('modalInputNome').value.trim(); if(!nome) return; meuNome=nome; document.getElementById('meuNomeDisplay').innerText=nome; localStorage.setItem('bingo_sessao_'+codigoSala, JSON.stringify({nome:meuNome, marcadorTipo:marcadorSelecionado, cor:corIcone})); document.getElementById('modalNome').classList.add('hidden'); if(connAdmin) connAdmin.send({type:'entrar', nome, id:meuId, marcadorTipo:marcadorSelecionado, cor:corIcone, online:true}); }
function handleDataAdmin(data, conn){
  if(data.type==='entrar'){
    const lower=data.nome.trim().toLowerCase();
    const existe=estadoSala.jogadores.find(x=>x.nome.trim().toLowerCase()===lower && x.id!==data.id);
    if(existe &&!data.reconexao){ conn.send({type:'erro_nome', msg:'Nome já usado!'}); return; }
    let j=estadoSala.jogadores.find(x=>x.id===data.id);
    if(!j){ j=estadoSala.jogadores.find(x=>x.nome.trim().toLowerCase()===lower); if(j){ j.id=data.id; } }
    if(!j){ j={id:data.id, nome:data.nome, marcadorTipo:data.marcadorTipo, cor:data.cor, limite:null, status:'pendente', cartelas:[], marcados:[], online:true, premiado:false}; estadoSala.jogadores.push(j); }
    broadcastEstado();
  }
  if(data.type==='reservar'){ toggleCartelaServer(data.cartId, data.jogId); }
  if(data.type==='pronto'){ const j=estadoSala.jogadores.find(x=>x.id===data.jogId); if(j) j.status='pronto'; broadcastEstado(); }
  if(data.type==='status'){ const j=estadoSala.jogadores.find(x=>x.id===data.jogId); if(j) j.online=data.online; broadcastEstado(); }
  if(data.type==='marcar'){ const j=estadoSala.jogadores.find(x=>x.id===data.jogId); if(j) j.marcados=data.marcados; broadcastEstado(); }
}
function toggleCartelaServer(cartId, jogId){
  const cart=estadoSala.cartelas.find(c=>c.id===cartId);
  const jog=estadoSala.jogadores.find(j=>j.id===jogId);
  if(!cart||!jog) return;
  if(estadoSala.cartelasPremiadas.includes(cartId)) return;
  if(cart.donoId && cart.donoId!==jogId) return;
  if(cart.donoId===jogId){ cart.donoId=null; cart.donoNome=null; jog.cartelas=jog.cartelas.filter(id=>id!==cartId); }
  else { if(jog.cartelas.length>=getLimite(jog)) return; cart.donoId=jogId; cart.donoNome=jog.nome; jog.cartelas.push(cartId); }
  jog.status='pendente'; broadcastEstado();
}
function broadcastEstado(){ localStorage.setItem('bingo_estado_'+codigoSala, JSON.stringify(estadoSala)); Object.values(conexoes).forEach(c=>{ try{ c.send({type:'estado', estado:estadoSala}); }catch(e){} }); render(); }
function handleDataJogador(data){
  if(data.type==='estado'){ const antes=estadoSala.jogadores? estadoSala.jogadores.find(j=>j.id===meuId):null; estadoSala=data.estado; if(!estadoSala.cartelasPremiadas) estadoSala.cartelasPremiadas=[]; document.getElementById('nomeSalaDisplay').innerText=estadoSala.nome; const depois=estadoSala.jogadores.find(j=>j.id===meuId); if(depois && depois.premiado && (!antes||!antes.premiado)){ mostrarPremio(); } render(); }
  if(data.type==='erro_nome'){ alert(data.msg); document.getElementById('modalNome').classList.remove('hidden'); }
  if(data.type==='premio'){ mostrarPremio(); }
}
function toggleCartela(id){ if(souAdmin){ toggleCartelaServer(id, meuId); } else { if(connAdmin) connAdmin.send({type:'reservar', cartId:id, jogId:meuId}); } }
function toggleNumeroManual(num){ const eu=estadoSala.jogadores.find(j=>j.id===meuId); if(!eu||eu.premiado) return; eu.marcados=eu.marcados||[]; if(eu.marcados.includes(num)) eu.marcados=eu.marcados.filter(n=>n!==num); else eu.marcados.push(num); if(connAdmin) connAdmin.send({type:'marcar', jogId:meuId, marcados:eu.marcados}); renderPreservaScroll(); }
function ficarPronto(){ if(connAdmin) connAdmin.send({type:'pronto', jogId:meuId}); }
function escolherExtra(){ modoEscolhaExtra=true; render(); }
function addLimite(id, d){ const j=estadoSala.jogadores.find(x=>x.id===id); let n=(j.limite!=null? j.limite:estadoSala.limitePadrao)+d; if(n<1) n=1; if(n>10) n=10; j.limite=n; broadcastEstado(); }
function iniciarPartida(){ estadoSala.status='jogando'; broadcastEstado(); }
function iniciarGiro(){ const bola=document.getElementById('bolaGirando'); document.getElementById('btnGirar').classList.add('hidden'); document.getElementById('btnParar').classList.remove('hidden'); bola.classList.add('girando'); intervaloGiro=setInterval(()=>{ bola.innerText=Math.floor(Math.random()*75)+1; },80); }
function pararGiro(){ clearInterval(intervaloGiro); document.getElementById('bolaGirando').classList.remove('girando'); document.getElementById('btnGirar').classList.remove('hidden'); document.getElementById('btnParar').classList.add('hidden'); sortearNumero(); }
function sortearNumero(){ const disp=[...Array(75).keys()].map(n=>n+1).filter(n=>!estadoSala.numerosSorteados.includes(n)); if(!disp.length) return; const num=disp[Math.floor(Math.random()*disp.length)]; estadoSala.numerosSorteados.push(num); document.getElementById('bolaGirando').innerText=num; broadcastEstado(); }
function copiarLinkSala(){ navigator.clipboard.writeText(location.origin+location.pathname+'?sala='+codigoSala); }
function soltarConfete(){ for(let i=0;i<80;i++){ const c=document.createElement('div'); c.className='confete'; c.style.left=Math.random()*100+'vw'; c.style.backgroundColor=`hsl(${Math.random()*360},100%,50%)`; document.body.appendChild(c); setTimeout(()=>c.remove(),4000); } }
function mostrarPremio(){ document.getElementById('modalPremio').classList.remove('hidden'); document.getElementById('modalPremio').classList.add('flex'); soltarConfete(); }
function fecharPremio(){ document.getElementById('modalPremio').classList.add('hidden'); document.getElementById('modalPremio').classList.remove('flex'); }
function toggleModalCartelasAdmin(){ const m=document.getElementById('modalCartelasAdmin'); if(m.classList.contains('hidden')){ m.classList.remove('hidden'); m.classList.add('flex'); renderCartelasAdminModal(); } else { m.classList.add('hidden'); m.classList.remove('flex'); } }
function renderCartelasAdminModal(){ const grid=document.getElementById('gridCartelasAdminModal'); grid.innerHTML=''; estadoSala.cartelas.filter(c=>!c.donoId).forEach(cart=>{ const div=document.createElement('div'); div.className='bg-zinc-50 border-2 rounded-xl p-2'; let html=`<div class='text-[10px] font-black mb-1'>${cart.numero}</div><div class='grid grid-cols-5 gap-[1px] text-[8px] font-bold'>`; for(let l of ['B','I','N','G','O']) html+=`<div class='bg-black text-white cell-square'>${l}</div>`; cart.grid.forEach(row=>{ row.forEach(v=>{ if(v==='BINGO FELIZ') html+=`<div class='border bg-black text-white cell-square flex-col text-[5px]'><span>BINGO</span><span>FELIZ</span></div>`; else html+=`<div class='border bg-white cell-square'>${v}</div>`; }); }); html+=`</div>`; div.innerHTML=html; grid.appendChild(div); }); }
function abrirConferirBingo(){ document.getElementById('modalConferir').classList.remove('hidden'); document.getElementById('modalConferir').classList.add('flex'); }
function fecharConferir(){ document.getElementById('modalConferir').classList.add('hidden'); document.getElementById('modalConferir').classList.remove('flex'); }
function fecharConferirContinuar(){ fecharConferir(); }
function checarBingo(){
  const txt=document.getElementById('inputConferir').value.trim(); if(!txt) return;
  const nums=txt.split(/[\s,]+/).map(n=>parseInt(n)).filter(n=>!isNaN(n));
  const faltam=nums.filter(n=>!estadoSala.numerosSorteados.includes(n));
  const res=document.getElementById('resultadoConferir'); res.classList.remove('hidden');
  const area=document.getElementById('areaPremiar');
  if(faltam.length===0){
    let achada=null, jogador=null;
    for(let cart of estadoSala.cartelas){ const todos=[]; cart.grid.forEach(r=>r.forEach(v=>{ if(v!=='BINGO FELIZ') todos.push(v); })); if(nums.every(n=>todos.includes(n))){ achada=cart; if(cart.donoId) jogador=estadoSala.jogadores.find(j=>j.id===cart.donoId); break; } }
    cartelaPremiadaTemp=achada;
    res.className='mt-4 p-3 rounded-xl bg-green-100 border-2 border-green-600 text-green-800 font-black';
    res.innerHTML=`🎉 PREMIADO!<br>${achada? 'Cartela '+achada.numero+(jogador? ' - '+jogador.nome:''):''}`;
    if(achada){ area.classList.remove('hidden'); area.innerHTML=`<button onclick="premiarCartela(${achada.id})" class="w-full bg-green-600 text-white rounded-xl py-3 font-black">🏆 PREMIADA</button>`; }
  } else {
    res.className='mt-4 p-3 rounded-xl bg-red-100 border-2 border-red-600 text-red-800 font-black';
    res.innerHTML=`❌ Faltam: ${faltam.join(', ')}`; area.classList.add('hidden');
  }
}
function premiarCartela(id){
  if(!estadoSala.cartelasPremiadas) estadoSala.cartelasPremiadas=[];
  estadoSala.cartelasPremiadas.push(id);
  const cart=estadoSala.cartelas.find(c=>c.id===id);
  let jog=null; if(cart && cart.donoId){ jog=estadoSala.jogadores.find(j=>j.id===cart.donoId); if(jog){ jog.premiado=true; } }
  broadcastEstado();
  if(jog){ const conn=conexoes[jog.id]; if(conn) try{ conn.send({type:'premio'});}catch(e){} }
  soltarConfete(); fecharConferir();
}
function renderPreservaScroll(){
  const car=document.getElementById('minhasCartelasGrande');
  const left=car?car.scrollLeft:0;
  render();
  setTimeout(()=>{ const n=document.getElementById('minhasCartelasGrande'); if(n) n.scrollLeft=left; },0);
}
function render(){
  if(!estadoSala.cartelas) return;
  const eu=souAdmin? null : estadoSala.jogadores.find(j=>j.id===meuId);
  document.getElementById('totalDisponibilizadas').innerText=estadoSala.total;
  const livres=estadoSala.cartelas.filter(c=>!c.donoId).length;
  document.getElementById('livresCount').innerText=`${livres} livres de ${estadoSala.total}`;
  document.getElementById('btnCartelasAdmin').innerText=`CARTELAS (${livres})`;

  const colCartelas=document.getElementById('colCartelas');
  const colContainer=document.getElementById('colCartelasContainer');
  const roleta=document.getElementById('adminRoleta');
  const btnCartelas=document.getElementById('btnCartelasAdmin');

  // 1. Lógica Admin jogando
  if(souAdmin && estadoSala.status==='jogando'){
    if(colCartelas) colCartelas.classList.add('hidden');
    if(roleta) roleta.classList.remove('hidden');
    if(btnCartelas) btnCartelas.classList.remove('hidden');
  } else {
    if(roleta) roleta.classList.add('hidden');
    if(btnCartelas) btnCartelas.classList.add('hidden');
    if(colCartelas) colCartelas.classList.remove('hidden');
  }

  const grid=document.getElementById('gridCartelas');
  const scrollSalvo=document.getElementById('minhasCartelasGrande')?.scrollLeft||0;
  const podeExtra=eu && eu.status==='pronto' && (eu.cartelas.length < getLimite(eu));

  // 2. Esconder números do convidado quando jogando
  const painelGeral=document.getElementById('painelSorteioGeral');
  const painelUlt=document.getElementById('painelUltimoConvidado');
  if(!souAdmin && estadoSala.status==='jogando'){
    painelGeral?.classList.add('hidden');
    painelUlt?.classList.add('hidden');
  } else {
    if(!souAdmin){ painelGeral?.classList.remove('hidden'); }
    if(souAdmin){ painelGeral?.classList.add('hidden'); }
  }

  if(grid){
    // CONVIDADO PRONTO - MOSTRA SUAS CARTELAS
    if(!souAdmin && eu && eu.status==='pronto' &&!modoEscolhaExtra &&!podeExtra){
      colContainer.classList.add('hidden');
      const painel=document.getElementById('painelConvidado');
      painel.classList.remove('hidden');
      if(eu.premiado){
        painel.innerHTML=`<div class="bg-green-100 border-2 border-green-600 rounded-xl p-4 text-center"><h2 class="text-2xl font-black">🏆 PARABÉNS!</h2><p>Você ganhou!!!</p></div>`;
      } else {
        const multi=eu.cartelas.length>1;
        painel.innerHTML=`<h3 class="font-black mb-2">MINHAS CARTELAS - ${eu.cartelas.length} ${multi?'(deslize)':''}</h3><div id="minhasCartelasGrande" class="${multi?'carousel':'space-y-4'}"></div><p class="text-center font-black text-green-600 mt-4">✅ PRONTO</p>`;
        const grande=document.getElementById('minhasCartelasGrande');
        grande.innerHTML='';
        eu.cartelas.forEach(id=>{
          const c=estadoSala.cartelas.find(x=>x.id===id); if(!c) return;
          const bloqueada=estadoSala.cartelasPremiadas.includes(id);
          let html=`<div class="${multi?'carousel-item ':''}bg-zinc-50 border-2 ${bloqueada?'border-yellow-500':'border-black'} rounded-xl p-3"><div class="grid grid-cols-5 gap-[1px]">`;
          for(let l of ['B','I','N','G','O']) html+=`<div class="bg-black text-white cell-square text-[10px] font-black">${l}</div>`;
          c.grid.forEach(row=>{
            row.forEach(v=>{
              if(v==='BINGO FELIZ'){ html+=`<div class="border bg-black text-white cell-square flex-col text-[7px] font-black"><span>BINGO</span><span>FELIZ</span></div>`; }
              else { const marcado=(eu.marcados||[]).includes(v); html+=`<div onclick="${bloqueada?'':'toggleNumeroManual('+v+')'}" class="border bg-white cell-square text-xs font-bold relative"><span class="cell-num">${v}</span>${marcado?`<span class="marcador-svg" style="color:${eu.cor}">${ICONES[eu.marcadorTipo]}</span>`:''}</div>`; }
            });
          });
          html+=`</div></div>`; grande.innerHTML+=html;
        });
        grande.scrollLeft=scrollSalvo;
      }
    } else if(!souAdmin && eu && podeExtra){
      colContainer.classList.remove('hidden');
      colCartelas.classList.remove('hidden');
      const painel=document.getElementById('painelConvidado');
      painel.innerHTML=`<div class="bg-[#25D366] p-3 rounded-xl font-black text-center mb-3">🎉 Você ganhou extra!</div><div id="minhasCartelasLista"></div><button onclick="escolherExtra()" class="w-full bg-black text-white rounded-xl py-3 font-black mt-2">🎯 ESCOLHER EXTRA</button>`;
      grid.innerHTML='';
      estadoSala.cartelas.forEach(cart=>{
        if(cart.donoId && cart.donoId!==meuId) return;
        if(estadoSala.cartelasPremiadas.includes(cart.id)) return;
        const minha=cart.donoId===meuId;
        const div=document.createElement('div'); div.className=`rounded-xl p-2 border-2 ${minha?'bg-green-100 border-green-600':'bg-zinc-50'}`;
        let html=`<div class='text-[10px] font-black'>${cart.numero} ${minha?'SUA':'LIVRE'}</div><div class='grid grid-cols-5 gap-[1px] text-[9px] font-bold'>`;
        for(let l of ['B','I','N','G','O']) html+=`<div class='bg-black text-white cell-square'>${l}</div>`;
        cart.grid.forEach(row=>{ row.forEach(v=>{ if(v==='BINGO FELIZ') html+=`<div class='border bg-black text-white cell-square flex-col text-[5px]'><span>BINGO</span><span>FELIZ</span></div>`; else html+=`<div class='border bg-white cell-square'>${v}</div>`; }); });
        html+=`</div>`; div.innerHTML=html; div.onclick=()=>toggleCartela(cart.id); grid.appendChild(div);
      });
    } else {
      // LOBBY - CONVIDADO SELECIONA CARTELA (FIX)
      colContainer.classList.remove('hidden');
      if(!(souAdmin && estadoSala.status==='jogando')){
        colCartelas.classList.remove('hidden');
      }
      grid.innerHTML='';
      estadoSala.cartelas.forEach(cart=>{
        if((estadoSala.cartelasPremiadas||[]).includes(cart.id)) return;
        const ocupada=cart.donoId && cart.donoId!==meuId;
        const minha=cart.donoId===meuId;
        const div=document.createElement('div');
        div.className=`rounded-xl p-2 border-2 cursor-pointer ${minha?'bg-green-100 border-green-600':'bg-zinc-50 border-zinc-200'} ${ocupada?'opacity-40 pointer-events-none':''}`;
        let html=`<div class='flex justify-between text-[10px] font-black mb-1'><span>${cart.numero}</span><span>${cart.donoNome?cart.donoNome.substring(0,8):'LIVRE'}</span></div><div class='grid grid-cols-5 gap-[1px] text-[9px] font-bold'>`;
        for(let l of ['B','I','N','G','O']) html+=`<div class='bg-black text-white cell-square'>${l}</div>`;
        cart.grid.forEach(row=>{ row.forEach(v=>{ if(v==='BINGO FELIZ') html+=`<div class='border bg-black text-white cell-square flex-col text-[5px]'><span>BINGO</span><span>FELIZ</span></div>`; else html+=`<div class='border bg-white cell-square'>${v}</div>`; }); });
        html+=`</div>`; div.innerHTML=html; div.onclick=()=>toggleCartela(cart.id); grid.appendChild(div);
      });
      if(!souAdmin && eu && eu.status!=='pronto'){
        const painel=document.getElementById('painelConvidado');
        painel.classList.remove('hidden');
        painel.innerHTML=`<h3 class="font-black mb-2">MINHAS CARTELAS ${eu.cartelas.length}/${getLimite(eu)}</h3><div id="minhasCartelasLista" class="space-y-1 mb-2">${eu.cartelas.map(id=>`<div class="bg-zinc-100 p-2 rounded text-xs">Cartela ${id} <button onclick="toggleCartela(${id})" class="float-right">X</button></div>`).join('')}</div><button onclick="ficarPronto()" class="w-full bg-black text-white rounded-xl py-3 font-black">✅ ESTOU PRONTO</button>`;
      }
    }
  }
  if(souAdmin){
    document.getElementById('listaJogadores').innerHTML=estadoSala.jogadores.map(j=>`<div class="flex justify-between border p-2 rounded-xl ${j.premiado?'bg-yellow-200':''}"><span>${j.premiado?'🏆':''}${j.nome} ${j.cartelas.length}/${getLimite(j)} ${j.status}</span><button onclick="addLimite('${j.id}',1)" class="bg-black text-white px-2 rounded text-xs">+1</button></div>`).join('');
    document.getElementById('ultimoNumeroAdmin').innerText=estadoSala.numerosSorteados.slice(-1)[0]||'--';
    document.getElementById('bolasSorteadasAdmin').innerHTML=estadoSala.numerosSorteados.map(n=>`<span class="bg-black text-white px-2 py-1 rounded-full text-xs">${n}</span>`).join('');
  }
  const ultimo=estadoSala.numerosSorteados.slice(-1)[0]||'--';
  document.getElementById('ultimoNumero').innerText=ultimo;
  const elC=document.getElementById('ultimoNumeroConvidado'); if(elC) elC.innerText=ultimo;
  document.getElementById('bolasSorteadas').innerHTML=estadoSala.numerosSorteados.map(n=>`<span class="bg-white text-black px-2 py-1 rounded-full text-xs">${n}</span>`).join('');
}
</script>
</body>
</html>
