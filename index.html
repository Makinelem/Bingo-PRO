<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo B&W Online - Fix Botão</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{font-family:Space Grotesk,sans-serif}
body{background:#000;color:#fff}
.white-card{background:#fff;color:#000;border:2px solid #000}
.black-card{background:#000;color:#fff;border:2px solid #fff}
.bw-btn{background:#fff;color:#000;font-weight:900;border:2px solid #000}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:900;border:1px solid #000;background:#fff;color:#000;position:relative;cursor:pointer}
.cell.marked{background:#000;color:#fff}
.cartela{cursor:pointer;border:2px solid #000;transition:.15s}
.cartela.sel{border-color:#000;box-shadow:0 0 0 3px #000;background:#f0f0f0}
</style>
</head>
<body class="min-h-screen p-2">

<div id="setup" class="min-h-screen flex items-center justify-center">
<div class="white-card rounded-[2rem] p-8 w-full max-w-md">
<h1 class="text-4xl font-black text-center">BINGO<span class="bg-black text-white px-3 ml-2">B&W</span></h1>
<p class="text-center text-xs font-bold opacity-60 mt-2">V1.1 - BOTÃO CORRIGIDO - 100% ONLINE</p>
<input id="nomeSala" placeholder="NOME DA SALA" class="w-full border-2 border-black p-4 rounded-xl mt-8 font-bold outline-none">
<input id="totalCartelas" type="number" value="20" class="w-full border-2 border-black p-4 rounded-xl mt-3 font-bold">
<button id="btnCriar" onclick="criarSala()" class="w-full bg-black text-white py-4 rounded-xl font-black mt-6 text-lg">DISPONIBILIZAR CARTELAS</button>
<p id="statusCriar" class="text-xs text-center mt-3 font-bold"></p>
</div>
</div>

<div id="admin" class="hidden max-w-6xl mx-auto">
<div class="white-card rounded-2xl p-5 flex flex-col md:flex-row justify-between gap-4">
<div class="flex-1">
<h2 id="tituloSala" class="text-2xl font-black"></h2>
<p id="estoqueInfo" class="text-sm font-bold mt-1"></p>
<input id="linkConvite" readonly class="w-full mt-3 border-2 border-black p-3 rounded-xl text-xs font-bold">
<div class="flex gap-2 mt-3">
<button onclick="copiarLink()" class="bg-black text-white px-5 py-2 rounded-xl text-sm font-black">COPIAR LINK</button>
<span class="border-2 border-black px-4 py-2 rounded-xl text-sm font-black">CÓDIGO: <b id="codigoSala"></b></span>
</div>
</div>
<div class="bg-white p-2 border-2 border-black rounded-xl h-fit"><div id="qrcode"></div></div>
</div>
<div class="grid md:grid-cols-12 gap-4 mt-4">
<div class="md:col-span-5"><div class="black-card rounded-2xl p-4"><h3 class="font-black">🎱 SORTEIO</h3><div id="ultimoNumero" class="text-6xl font-black text-center py-6">--</div><button onclick="sortear()" class="w-full bw-btn py-3 rounded-xl">SORTEAR</button><div id="numerosSorteados" class="flex flex-wrap gap-1 mt-3"></div><button id="btnIniciar" onclick="iniciarPartida()" class="w-full mt-4 bg-white text-black py-3 rounded-xl font-black">🚀 INICIAR</button></div></div>
<div class="md:col-span-7 black-card rounded-2xl p-4"><h3 class="font-black">👥 JOGADORES NA SALA</h3><p class="text-xs opacity-70">🔴 VERMELHO = Entrou na sala | 🟢 + ✅ VISTO = Escolheu e clicou PRONTO</p><div id="listaJogadores" class="mt-4 space-y-2"></div><div class="border-t border-white/20 mt-6 pt-4"><p class="text-xs font-bold">LIBERAR EXTRA (ANTES DE INICIAR)</p><div class="flex gap-2 mt-2"><select id="selectJogador" class="bg-white text-black border-2 border-black rounded-xl p-2 flex-1 font-bold text-sm"></select><input id="qtdExtra" type="number" value="1" class="bg-white text-black w-20 border-2 border-black rounded-xl p-2 font-bold"><button onclick="liberarExtra()" class="bg-white text-black px-4 rounded-xl font-black text-sm">LIBERAR</button></div></div></div>
</div>
</div>

<div id="player" class="hidden max-w-6xl mx-auto">
<div id="playerLogin" class="min-h-screen flex items-center justify-center"><div class="white-card rounded-[2rem] p-8 w-full max-w-md"><h1 class="text-3xl font-black text-center">ENTRAR NA SALA</h1><p id="playerSalaNome" class="text-center text-xs font-bold opacity-60 mt-2"></p><input id="nomeJogador" placeholder="SEU NOME" class="w-full border-2 border-black p-4 rounded-xl mt-6 font-bold"><p class="text-xs font-black mt-4">MARCADOR:</p><div class="grid grid-cols-5 gap-2 mt-2"><button onclick="setMarcador('🔴')" class="border-2 border-black p-3 rounded-xl">🔴</button><button onclick="setMarcador('🔵')" class="border-2 border-black p-3 rounded-xl">🔵</button><button onclick="setMarcador('🟢')" class="border-2 border-black p-3 rounded-xl">🟢</button><button onclick="setMarcador('❌')" class="border-2 border-black p-3 rounded-xl">❌</button><button onclick="setMarcador('✅')" class="border-2 border-black p-3 rounded-xl bg-black text-white">✅</button></div><div class="text-center mt-3 font-black">MARCADOR: <span id="marcadorAtual" class="text-2xl">🔴</span></div><button onclick="entrarNaSala()" class="w-full bg-black text-white py-4 rounded-xl font-black mt-6">ENTRAR NA SALA</button></div></div>
<div id="playerEscolha" class="hidden pb-24"><div class="white-card rounded-2xl p-4 mb-4 flex justify-between sticky top-2 z-10"><h2 class="font-black">ESCOLHA SUA CARTELA</h2><span id="playerEstoque" class="text-sm font-black"></span></div><div id="gridDisponiveis" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3"></div><div class="fixed bottom-0 left-0 right-0 bg-black border-t-2 border-white p-4 flex justify-between items-center"><span id="escolhidaInfo" class="text-sm font-bold text-white">NENHUMA SELECIONADA</span><button id="btnPronto" onclick="clicarPronto()" disabled class="bg-[#222] text-[#666] px-10 py-3 rounded-xl font-black">✅ PRONTO</button></div></div>
<div id="playerJogo" class="hidden"><div class="white-card rounded-2xl p-4 flex justify-between mb-4"><span id="playerNomeDisplay" class="font-black"></span><span class="font-black">ÚLTIMO: <b id="playerUltimo" class="text-xl">--</b></span></div><div id="gridJogo" class="grid md:grid-cols-2 gap-6 max-w-4xl mx-auto"></div></div>
</div>

<script>
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%1000000; return h; }
function seededRandom(s){ return Math.abs(Math.sin(s)*10000)%1; }
function gerarCartela(seedStr){
  const ranges=[[1,15],[16,30],[31,45],[46,60],[61,75]];
  let base=hash(seedStr);
  let cols=ranges.map(([min,max], ci)=>{ let arr=[]; let t=0; while(arr.length<5){ let n=Math.floor(seededRandom(base+ci*100+t*7)*(max-min+1))+min; if(!arr.includes(n)) arr.push(n); t++; } return arr; });
  let card=[]; for(let r=0;r<5;r++){ let row=[]; for(let c=0;c<5;c++) row.push(cols[c][r]); card.push(row);} card[2][2]='FREE';
  return {id: seedStr, numeros:card, marcados:Array(5).fill(0).map((_,i)=>Array(5).fill(false).map((__,j)=>i==2&&j==2))};
}

let state=null, meuId=localStorage.getItem('bingo_bw_meuid'), marcador='🔴', cartelaSel=null, roomId=null;
let codigoUrl=new URLSearchParams(location.search).get('jogo');
let totalUrl=parseInt(new URLSearchParams(location.search).get('total'))||0;
let adminCode=new URLSearchParams(location.search).get('admin');

function setMarcador(m){ marcador=m; document.getElementById('marcadorAtual').innerText=m; }

// BOTÃO CORRIGIDO - 100% LOCAL AGORA, DEPOIS SINCRONIZA ONLINE
function criarSala(){
  const btn=document.getElementById('btnCriar');
  const status=document.getElementById('statusCriar');
  try{
    btn.innerText='GERANDO...';
    btn.disabled=true;
    const nome=document.getElementById('nomeSala').value||'BINGO B&W';
    const total=parseInt(document.getElementById('totalCartelas').value)||20;
    if(total<1||total>100){ alert('Coloque entre 1 e 100 cartelas'); btn.innerText='DISPONIBILIZAR CARTELAS'; btn.disabled=false; return; }
    const codigo=Math.random().toString(36).substring(2,6).toUpperCase();
    let pool=[]; for(let i=0;i<total;i++) pool.push(gerarCartela(codigo+'-'+i));
    state={sala:{nome,codigo,total}, pool, jogadores:[], sorteados:[], iniciada:false};
    // Salva em 2 lugares para garantir
    localStorage.setItem('bingo_room_'+codigo, JSON.stringify(state));
    localStorage.setItem('bingo_last_room', codigo);
    status.innerText='✅ SALA CRIADA COM '+total+' CARTELAS! REDIRECIONANDO...';
    console.log('Sala criada:', codigo, total);
    setTimeout(()=>{ location.href=location.origin+location.pathname+'?admin='+codigo; },500);
  }catch(e){
    console.error(e);
    alert('Erro ao criar sala: '+e.message);
    btn.innerText='DISPONIBILIZAR CARTELAS';
    btn.disabled=false;
  }
}

function mostrarAdmin(codigo){
  roomId=codigo;
  const key='bingo_room_'+codigo;
  state=JSON.parse(localStorage.getItem(key)||'null');
  if(!state){ alert('Sala não encontrada: '+codigo); location.href=location.pathname; return; }
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('admin').classList.remove('hidden');
  document.getElementById('tituloSala').innerText=state.sala.nome;
  document.getElementById('codigoSala').innerText=state.sala.codigo;
  const link=location.origin+location.pathname+'?jogo='+state.sala.codigo+'&total='+state.sala.total;
  document.getElementById('linkConvite').value=link;
  document.getElementById('qrcode').innerHTML=''; new QRCode(document.getElementById('qrcode'), {text:link, width:110, height:110});
  renderAdmin();
  // Polling para atualizar quando jogador entrar (mesmo celular em outra aba)
  setInterval(()=>{
    const fresh=JSON.parse(localStorage.getItem(key)||'null');
    if(fresh){ state=fresh; renderAdmin(); }
  },800);
}

function renderAdmin(){
  if(!state) return;
  const disp=state.pool.filter(c=>!state.jogadores.some(j=>j.cartelas.some(jc=>jc.id===c.id)));
  document.getElementById('estoqueInfo').innerText=`DISPONIBILIZADAS: ${state.sala.total} | LIVRES: ${disp.length} | JOGADORES: ${state.jogadores.length}`;
  document.getElementById('numerosSorteados').innerHTML=state.sorteados.map(n=>`<span class="bg-black text-white border border-white w-7 h-7 rounded-full flex items-center justify-center text-xs font-black">${n}</span>`).join('');
  if(state.sorteados.length) document.getElementById('ultimoNumero').innerText=state.sorteados[state.sorteados.length-1];
  document.getElementById('listaJogadores').innerHTML=state.jogadores.map(j=>{
    const isPronto=j.status==='pronto';
    const cor=isPronto?'bg-white text-black border-2 border-black':'bg-[#111] text-white border border-red-500';
    const bola=isPronto?'🟢':'🔴';
    const visto=isPronto?'✅ VISTO':'';
    return `<div class="p-3 rounded-xl ${cor} flex justify-between"><span class="font-black text-sm">${bola} ${j.nomes.join(', ')} {${j.cartelas.length}} - ${j.marcador} - ${j.status.toUpperCase()} ${visto}</span></div>`;
  }).join('') || '<p class="text-xs opacity-60">Nenhum jogador. Abra o link em outra aba do mesmo navegador para testar.</p>';
  document.getElementById('selectJogador').innerHTML=state.jogadores.filter(j=>j.status==='pronto').map(j=>`<option value="${j.id}">${j.nomes[0]}</option>`).join('');
}

function save(){
  if(!state) return;
  localStorage.setItem('bingo_room_'+state.sala.codigo, JSON.stringify(state));
  renderAdmin();
}

function initPlayer(){
  roomId=codigoUrl;
  const key='bingo_room_'+codigoUrl;
  state=JSON.parse(localStorage.getItem(key)||'null');
  if(!state){
    const totalFinal=totalUrl||20;
    let pool=[]; for(let i=0;i<totalFinal;i++) pool.push(gerarCartela(codigoUrl+'-'+i));
    state={sala:{nome:'Sala '+codigoUrl, codigo:codigoUrl, total:totalFinal}, pool, jogadores:[], sorteados:[], iniciada:false};
    localStorage.setItem(key, JSON.stringify(state));
  }
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('player').classList.remove('hidden');
  document.getElementById('playerSalaNome').innerText=`SALA ${codigoUrl} - ${state.sala.total} CARTELAS DISPONIBILIZADAS`;
  setInterval(()=>{ const fresh=JSON.parse(localStorage.getItem(key)||'null'); if(fresh){ state=fresh; renderPlayer(); } },800);
  if(meuId && state.jogadores.find(j=>j.id===meuId)) renderPlayer();
}

function entrarNaSala(){
  const nome=document.getElementById('nomeJogador').value.trim(); if(!nome) return alert('NOME');
  let j={id:Date.now().toString(), nomes:[nome], cartelas:[], marcador, status:'na_sala'};
  state.jogadores.push(j); meuId=j.id; localStorage.setItem('bingo_bw_meuid', meuId);
  localStorage.setItem('bingo_room_'+roomId+'_meuid', meuId);
  localStorage.setItem('bingo_room_'+state.sala.codigo, JSON.stringify(state));
  renderPlayer();
}

function renderPlayer(){
  const eu=state.jogadores.find(j=>j.id===meuId); if(!eu) return;
  if(eu.status==='na_sala'){
    document.getElementById('playerLogin').classList.add('hidden');
    document.getElementById('playerEscolha').classList.remove('hidden');
    document.getElementById('playerJogo').classList.add('hidden');
    const disp=state.pool.filter(c=>!state.jogadores.some(j=>j.cartelas.some(jc=>jc.id===c.id)));
    document.getElementById('playerEstoque').innerText=disp.length;
    document.getElementById('gridDisponiveis').innerHTML=disp.map(card=>`
      <div onclick="selecionarCartela('${card.id}')" id="mini-${card.id}" class="cartela white-card rounded-xl p-2"><div class="grid grid-cols-5 gap-[2px]">${card.numeros.map((row,r)=>row.map((num,c)=>`<div class="text-[9px] text-center py-1 border border-black ${r==2&&c==2?'bg-black text-white':'bg-white text-black'}">${num==='FREE'?'★':num}</div>`).join('')).join('')}</div></div>`).join('');
  } else {
    document.getElementById('playerLogin').classList.add('hidden');
    document.getElementById('playerEscolha').classList.add('hidden');
    document.getElementById('playerJogo').classList.remove('hidden');
    document.getElementById('playerNomeDisplay').innerText=eu.nomes.join(', ')+' - '+eu.cartelas.length+' CARTELA(S) ✅ VISTO';
    document.getElementById('playerUltimo').innerText=state.sorteados[state.sorteados.length-1]||'--';
    document.getElementById('gridJogo').innerHTML=eu.cartelas.map((card,ci)=>`<div class="white-card rounded-[1.5rem] p-4"><div class="grid grid-cols-5 gap-1">${['B','I','N','G','O'].map(l=>`<div class="text-center font-black text-xs">${l}</div>`).join('')}${card.numeros.map((row,r)=>row.map((num,c)=>`<div onclick="marcar(${ci},${r},${c})" class="cell ${card.marcados[r][c]?'marked':''}">${num==='FREE'?'★':num}${card.marcados[r][c]?`<div class="absolute inset-0 flex items-center justify-center text-xl">${eu.marcador}</div>`:''}</div>`).join('')).join('')}</div></div>`).join('');
  }
}

function selecionarCartela(id){ document.querySelectorAll('.cartela').forEach(el=>el.classList.remove('sel')); document.getElementById('mini-'+id)?.classList.add('sel'); cartelaSel=id; document.getElementById('escolhidaInfo').innerText='SELECIONADA: '+id.slice(-4); const btn=document.getElementById('btnPronto'); btn.disabled=false; btn.classList.remove('bg-[#222]','text-[#666]'); btn.classList.add('bg-white','text-black'); }
function clicarPronto(){ const eu=state.jogadores.find(j=>j.id===meuId); if(!eu||!cartelaSel) return; const card=state.pool.find(c=>c.id===cartelaSel); if(!card) return alert('JÁ FOI PEGA'); if(state.jogadores.some(j=>j.cartelas.some(jc=>jc.id===card.id))) return alert('JÁ ESCOLHIDA'); eu.cartelas.push(JSON.parse(JSON.stringify(card))); eu.status='pronto'; cartelaSel=null; localStorage.setItem('bingo_room_'+state.sala.codigo, JSON.stringify(state)); renderPlayer(); }
function marcar(ci,r,c){ const eu=state.jogadores.find(j=>j.id===meuId); if(eu.cartelas[ci].numeros[r][c]==='FREE') return; eu.cartelas[ci].marcados[r][c]=!eu.cartelas[ci].marcados[r][c]; localStorage.setItem('bingo_room_'+state.sala.codigo, JSON.stringify(state)); renderPlayer(); }
function sortear(){ if(!state) return; if(!state.iniciada) state.iniciada=true; let disp=[...Array(75)].map((_,i)=>i+1).filter(n=>!state.sorteados.includes(n)); if(!disp.length) return; state.sorteados.push(disp[Math.floor(Math.random()*disp.length)]); save(); }
function iniciarPartida(){ if(!state) return; state.iniciada=true; save(); document.getElementById('btnIniciar').innerText='✅ PARTIDA INICIADA'; }
function liberarExtra(){ const id=document.getElementById('selectJogador').value; const q=parseInt(document.getElementById('qtdExtra').value)||1; const j=state.jogadores.find(x=>x.id===id); if(!j) return; j.pendenteExtra=(j.pendenteExtra||0)+q; save(); }
function copiarLink(){ navigator.clipboard.writeText(document.getElementById('linkConvite').value); alert('Link copiado!'); }

if(adminCode){ mostrarAdmin(adminCode); }
else if(codigoUrl){ initPlayer(); }

console.log('Bingo B&W V1.1 carregado - botão corrigido');
</script>
</body>
</html>
